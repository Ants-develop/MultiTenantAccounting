services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: mssql-server
    hostname: mssql-server
    user: "0:0"  # Run as root to avoid permission issues
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=asQW12ZX12!!
      - MSSQL_PID=Developer
      - MSSQL_TCP_PORT=1433
    volumes:
      # Persist data with Docker-managed volumes (avoids permission issues)
      - mssql-data:/var/opt/mssql/data
      # Persist backups
      - mssql-backups:/var/opt/mssql/backups
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "asQW12ZX12!!" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  mssql-data:
  mssql-backups:
